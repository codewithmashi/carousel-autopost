name: Publish carousel

on:
  schedule:
    # Mon/Wed/Fri 19:12 IST = 13:42 UTC. GitHub cron is always UTC.
    - cron: '42 13 * * 1,3,5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preflight only — do not post'
        type: boolean
        default: false

concurrency:
  group: publish-carousel      # never let two runs post at once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to commit the advanced QUEUE back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish next in queue
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/publish-next.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit queue state
        if: ${{ !inputs.dry_run }}
        run: |
          if [[ -n "$(git status --porcelain QUEUE PUBLISHED.log)" ]]; then
            git config user.name  "carousel-bot"
            git config user.email "actions@github.com"
            git add QUEUE PUBLISHED.log
            git commit -m "publish: advance queue [skip ci]"
            git push
          else
            echo "no queue change to commit"
          fi
